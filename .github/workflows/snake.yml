name: Generate Contribution Snake

on:
  schedule:
    # 03:30 UTC daily (cron is UTC), offset from the stats workflow
    - cron: "30 3 * * *"
  workflow_dispatch:

# Needed only to push the generated files to the `output` branch.
permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#ECEAF7,#D4C6FF,#B8A1FF,#8B5CF6,#6D3FE0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#191927,#3B2F73,#5B3FB5,#8B5CF6,#B8A1FF

      - name: Verify generated files
        run: |
          set -euo pipefail
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          git commit --quiet -m "chore: update contribution snake"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch holds only generated files, so it is recreated with a
          # single commit each run (no history growth). It is created on first run.
          git push --force origin output
