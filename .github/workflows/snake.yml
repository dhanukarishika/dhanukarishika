name: Update GitHub Profile Stats

on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate GitHub stats
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: >-
        username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0d0d18&title_color=c084fc&text_color=a5b4fc&icon_color=818cf8&border_radius=10
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate top languages
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: top-langs
      options: >-
        username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=0d0d18&title_color=c084fc&text_color=a5b4fc&border_radius=10
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit updated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/*.svg

      git diff --cached --quiet || git commit -m "Update GitHub profile stats"

      git push
```
