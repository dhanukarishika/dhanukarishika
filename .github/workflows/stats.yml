name: Update GitHub Profile Stats

on:
  schedule:
    # 03:00 UTC daily (GitHub Actions cron is always UTC; this is 08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch:

# Least privilege: the job only needs to push the generated SVGs.
permissions:
  contents: write

# Never run two stat updates at once (avoids push races).
concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=191927&title_color=B8A1FF&text_color=E8E7F3&icon_color=67E8F9&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=191927&title_color=B8A1FF&text_color=E8E7F3&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Verify generated cards
        run: |
          set -euo pipefail
          for f in profile/stats.svg profile/top-langs.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            if grep -q "Something went wrong" "$f"; then
              echo "::error::$f is an error card, not real stats"
              exit 1
            fi
          done

      - name: Commit updated cards (only if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub profile stats"
          git push
